name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS --max-time 120 -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" -o /dev/null -w "hook:%{http_code}\n"
